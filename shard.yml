name: partiduo-crm
version: 0.1.0

description: |
  Extension CRM de Partiduo (ADR-009) : relation client avant le devis —
  organisations et contacts (prospects, consentement RGPD), opportunités
  dans un pipeline par étapes, activités à échéance, passage de
  l'opportunité au devis de la Facturation, tableau de bord commercial,
  import et export CSV.

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-crm-manage:
    main: manage.cr

dependencies:
  # Le cœur : registre, événements et contrat Partiduo::Api (fiches,
  # Facturation).
  partiduo:
    path: ../partiduo-app
  marten:
    path: ../../marten

development_dependencies:
  # L'interface qui monte ui/bulma/ : nécessaire aux specs, à manage.cr et
  # à la démonstration ; la distribution l'apporte elle-même.
  partiduo-ui-bulma:
    path: ../partiduo-ui-bulma
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
